# ComplyTrack frontend — nginx server block.
#
# Serves the Vite SPA from /usr/share/nginx/html, proxies /api/ (and /health)
# to the `backend` service, and sets the same security headers the FastAPI app
# sets so behaviour is identical whether the UI is behind nginx or served by the
# API itself.

# Upstream is the Compose service name. Edit this for a non-Compose deployment
# (e.g. `server 127.0.0.1:8000;`).
upstream complytrack_backend {
    server backend:8000;
    keepalive 32;
}

# gzip for text assets. Brotli needs the optional ngx_brotli module, which the
# stock nginx:alpine image does not ship; enable it here if you build a custom
# image (see the commented block below).
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml
    application/rss+xml
    application/manifest+json
    image/svg+xml;

# If you build an nginx image with ngx_brotli, enable this instead/additionally:
# brotli on;
# brotli_comp_level 6;
# brotli_types text/plain text/css application/json application/javascript
#              image/svg+xml application/manifest+json;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads are capped at 25 MB by the app; leave headroom for multipart
    # overhead so nginx never returns its own 413 before FastAPI validates.
    client_max_body_size 32m;

    # Security headers for everything that does not set its own.
    include /etc/nginx/snippets/complytrack-security-headers.conf;

    # ---- API reverse proxy ------------------------------------------------ #
    location /api/ {
        proxy_pass http://complytrack_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # API responses are per-user. The app already sends Cache-Control:
        # no-store on /api/ paths, so nginx adds nothing here and therefore
        # keeps the inherited security headers.
    }

    # Health probe through the same origin, for load balancers.
    location = /health {
        proxy_pass http://complytrack_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # ---- PWA files must never be cached, or updates never land ------------ #
    # `expires -1` sets Cache-Control: no-cache without an add_header, so the
    # server-level security headers are still inherited.
    location = /service-worker.js {
        expires -1;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        expires -1;
        try_files $uri =404;
    }

    # ---- fingerprinted build assets: cache forever ------------------------ #
    location /assets/ {
        access_log off;
        include /etc/nginx/snippets/complytrack-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Hashed media/fonts.
    location ~* \.(?:ico|gif|jpe?g|png|svg|webp|woff2?|ttf|eot|map)$ {
        access_log off;
        expires 30d;
        try_files $uri =404;
    }

    # ---- SPA fallback: deep links and client-side routing ----------------- #
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The HTML shell is revalidated so a new deploy is picked up.
    location = /index.html {
        expires -1;
    }

    # Do not advertise the nginx version.
    server_tokens off;
}
