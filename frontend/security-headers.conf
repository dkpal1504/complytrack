# Shared security headers for every server/location block.
#
# nginx does NOT inherit add_header directives into a block that declares its
# own add_header, so this snippet is included in each location that sets a
# Cache-Control header as well as at server level. Keep the two in sync with
# backend/app/main.py (security_and_timing middleware).

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# CSP tuned for a Vite/React SPA talking to its own origin:
#  - 'unsafe-inline' for style-src is required by charting/UI libraries that
#    write inline style attributes; script-src stays strict.
#  - connect-src 'self' covers the /api reverse proxy on this origin.
#  - worker-src blob: is needed by some bundler-generated web workers.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
